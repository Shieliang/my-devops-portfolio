name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # 允许申请 OIDC 令牌
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::987762561422:role/Devops-Porfolio-Role
          aws-region: us-east-1

      - name: Sync files to S3
        run: aws s3 sync ./src s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"